# Room 스키마 · 마이그레이션 확인. 파괴적 폴백이 없으므로 이전 경로가 빠지면 사용자 폰에서 앱이 열리지 않는다.
#   1) MigrationTest: 내보낸 스키마 JSON 으로 옛 버전 DB 를 만들어 현재 버전까지 이전 → 경로가 없으면 실패
#   2) 스키마 JSON 이 커밋과 다르면 실패 — 버전을 안 올리고 스키마를 바꿨거나(JSON 이 덮어써짐) 새 버전 JSON 을 커밋하지 않은 것
name: Room

on:
  push:
    branches: [develop, main, 'feature/**']
    paths:
      - 'core/database/**'
      - 'core/tti/**'
      - 'core/model/**'
      - 'common/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - '.github/workflows/room.yml'
  pull_request:
    branches: [develop, main]
    paths:
      - 'core/database/**'
      - 'core/tti/**'
      - 'core/model/**'
      - 'common/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - '.github/workflows/room.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: room-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: 마이그레이션 테스트
        run: ./gradlew :core:database:jvmTest :core:tti:jvmTest --stacktrace

      - name: 스키마 JSON 이 커밋과 같은지
        run: |
          CHANGED=$(git status --porcelain -- core/database/schemas core/tti/schemas)
          if [ -n "$CHANGED" ]; then
            echo "$CHANGED"
            echo '스키마가 커밋된 JSON 과 다르다. 스키마를 바꿨다면 버전을 올리고 AutoMigration 또는 Migration + 새 버전 JSON 을 함께 커밋한다.'
            git diff -- core/database/schemas core/tti/schemas | head -100
            exit 1
          fi
