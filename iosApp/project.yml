# XcodeGen 프로젝트 정의. macOS 에서: `brew install xcodegen && cd iosApp && xcodegen` → Kkotsin.xcodeproj
#
# 타깃
#   Kkotsin              앱. Compose Multiplatform 셸(ComposeApp.framework)을 띄운다.
#   KkotsinNotification  Notification Service Extension. Kotlin · Firebase 없이 swift-sodium 만(메모리 24MB 한도).
#   KkotsinWidgets       WidgetKit + App Intent(보고싶어). Firebase 없이 sendFromWidget 엔드포인트로 보낸다.
#   KkotsinTests         spec/test-vectors 를 Swift 로 검증.
#
# 공유: App Group(group.com.sadturtleman.kkotsin) — 위젯 스냅샷 · 받은 Op 대기열 · 위젯 사본.
#       Keychain access group — 기기 키 · 커플 키(ThisDeviceOnly).
name: Kkotsin
options:
  bundleIdPrefix: com.sadturtleman
  deploymentTarget:
    iOS: "17.0"
packages:
  Sodium:
    url: https://github.com/jedisct1/swift-sodium
    from: 0.9.1
settings:
  base:
    DEVELOPMENT_TEAM: ""   # 팀 id 를 넣는다
    SWIFT_VERSION: "5.10"
targets:
  Kkotsin:
    type: application
    platform: iOS
    sources: [App, Shared]
    preBuildScripts:
      - name: Build ComposeApp framework
        script: |
          cd "$SRCROOT/.."
          ./gradlew :composeApp:embedAndSignAppleFrameworkForXcode
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sadturtleman.kkotsin
        FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)/../composeApp/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: "$(inherited) -framework ComposeApp"
    entitlements:
      path: App/Kkotsin.entitlements
      properties:
        com.apple.security.application-groups: [group.com.sadturtleman.kkotsin]
        keychain-access-groups: ["$(AppIdentifierPrefix)com.sadturtleman.kkotsin.shared"]
        aps-environment: development
    dependencies:
      - target: KkotsinNotification
      - target: KkotsinWidgets
      - package: Sodium
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: 꽃신
        UIBackgroundModes: [remote-notification, fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.sadturtleman.kkotsin.refresh]
  KkotsinNotification:
    type: app-extension
    platform: iOS
    sources: [NotificationService, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sadturtleman.kkotsin.notification
    entitlements:
      path: NotificationService/KkotsinNotification.entitlements
      properties:
        com.apple.security.application-groups: [group.com.sadturtleman.kkotsin]
        keychain-access-groups: ["$(AppIdentifierPrefix)com.sadturtleman.kkotsin.shared"]
    dependencies:
      - package: Sodium
    info:
      path: NotificationService/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
  KkotsinWidgets:
    type: app-extension
    platform: iOS
    sources: [Widgets, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sadturtleman.kkotsin.widgets
    entitlements:
      path: Widgets/KkotsinWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.sadturtleman.kkotsin]
        keychain-access-groups: ["$(AppIdentifierPrefix)com.sadturtleman.kkotsin.shared"]
    dependencies:
      - package: Sodium
    info:
      path: Widgets/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  KkotsinTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests, Shared]
    dependencies:
      - package: Sodium
