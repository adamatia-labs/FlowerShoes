# XcodeGen 프로젝트 정의. macOS 에서: `brew install xcodegen && cd iosApp && xcodegen` → Kkotsin.xcodeproj
#
# 타깃
#   Kkotsin              앱. Compose Multiplatform 셸(ComposeApp.framework)을 띄운다.
#   KkotsinNotification  Notification Service Extension. Kotlin · Firebase 없이 swift-sodium 만(메모리 24MB 한도).
#   KkotsinWidgets       WidgetKit + App Intent(보고싶어). Firebase 없이 sendFromWidget 엔드포인트로 보낸다.
#   KkotsinTests         spec/test-vectors 를 Swift 로 검증.
#
# 공유: App Group(group.com.sadturtleman.kkotsin) — 위젯 스냅샷 · 받은 Op 대기열 · 위젯 사본.
#       Keychain access group — 기기 키 · 커플 키(ThisDeviceOnly).
name: Kkotsin
options:
  bundleIdPrefix: com.sadturtleman
  deploymentTarget:
    iOS: "17.0"
packages:
  Sodium:
    url: https://github.com/jedisct1/swift-sodium
    from: 0.9.1
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    # GitLive 2.7 이 빌드한 Firebase iOS SDK(11.8) 이상, FirebaseAnalyticsCore 가 생긴 11.14 부터
    from: 11.14.0
  # zstd 저장소의 Package.swift(C 모듈 libzstd). 그림 문서 · 백업 압축.
  Zstd:
    url: https://github.com/facebook/zstd
    from: 1.5.6
  # 소셜 로그인(앱 타깃만)
  KakaoSDK:
    url: https://github.com/kakao/kakao-ios-sdk
    from: 2.22.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 8.0.0
  # 광고(앱 타깃만): AdMob 배너 + 동의(UMP)
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads
    from: 12.0.0
  GoogleUMP:
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform
    from: 3.0.0
  # 꽃신 평생 결제(앱 타깃만)
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios-spm.git
    from: 5.0.0
settings:
  base:
    DEVELOPMENT_TEAM: F88SA5KHB4
    # Kotlin 프레임워크는 arm64 시뮬레이터만 만든다(Apple Silicon). Intel 시뮬레이터는 빌드하지 않는다.
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
    SWIFT_VERSION: "5.10"
targets:
  Kkotsin:
    type: application
    platform: iOS
    # 로그인 키(Config.xcconfig, 커밋하지 않음 — Config.xcconfig.example 참고)
    configFiles:
      Debug: Config.xcconfig
      Release: Config.xcconfig
    sources: [App, Shared]
    scheme:
      testTargets: [KkotsinTests]
    preBuildScripts:
      - name: Build ComposeApp framework
        script: |
          cd "$SRCROOT/.."
          ./gradlew :composeApp:embedAndSignAppleFrameworkForXcode
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sadturtleman.kkotsin
        # 앱 아이콘: 꽃신 로고(꽃). App/Assets.xcassets 의 1024 한 장으로 모든 크기를 만든다.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)/../composeApp/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: "$(inherited) -framework ComposeApp"
      # 디버그는 GA4 자동 수집(first_open · session_start · screen_view)도 끈다(Info.plist 의 FIREBASE_ANALYTICS_COLLECTION_ENABLED).
      # BizEvent 는 디버그 바이너리면 이미 표준 출력으로만 간다.
      configs:
        Debug:
          KKOTSIN_ANALYTICS_COLLECTION: "NO"
        Release:
          KKOTSIN_ANALYTICS_COLLECTION: "YES"
    entitlements:
      path: App/Kkotsin.entitlements
      properties:
        com.apple.security.application-groups: [group.com.sadturtleman.kkotsin]
        keychain-access-groups: ["$(AppIdentifierPrefix)com.sadturtleman.kkotsin.shared"]
        aps-environment: development
        com.apple.developer.applesignin: [Default]
        # 초대 링크 Universal Links(https://{INVITE_HOST}/i/{token}). 검증 파일은 firebase/hosting/public/.well-known/apple-app-site-association
        com.apple.developer.associated-domains: ["applinks:$(INVITE_HOST)"]
    dependencies:
      - target: KkotsinNotification
      - target: KkotsinWidgets
      - package: Sodium
      - package: Zstd
        product: libzstd
      - package: KakaoSDK
        product: KakaoSDKUser
      # 초대 링크: 카카오 사용자 정의 피드 템플릿 공유
      - package: KakaoSDK
        product: KakaoSDKShare
      - package: KakaoSDK
        product: KakaoSDKTemplate
      - package: GoogleSignIn
      - package: GoogleMobileAds
      - package: GoogleUMP
        product: GoogleUserMessagingPlatform
      - package: RevenueCat
      # GitLive firebase-kotlin-sdk 가 링크하는 Firebase iOS SDK(앱 타깃만 — NSE · 위젯에는 넣지 않는다)
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseStorage
      - package: Firebase
        product: FirebaseFunctions
      - package: Firebase
        product: FirebaseMessaging
      # GA4. 광고 ID(IDFA)를 모으지 않는 변형이다 — FirebaseAnalytics 가 아니라 Core.
      - package: Firebase
        product: FirebaseAnalyticsCore
      - package: Firebase
        product: FirebaseRemoteConfig
    info:
      path: App/Info.plist
      properties:
        KkotsinKeychainAccessGroup: $(AppIdentifierPrefix)com.sadturtleman.kkotsin.shared
        CFBundleDisplayName: 꽃신
        # 그림 보내기: 카메라로 찍어 배경으로 · 완성 그림을 사진첩에 저장
        NSCameraUsageDescription: 그림 배경으로 쓸 사진을 찍어요.
        NSPhotoLibraryAddUsageDescription: 그린 그림을 사진첩에 저장해요.
        NSFaceIDUsageDescription: 계정 작업 전에 본인인지 확인해요.
        NSUserTrackingUsageDescription: 맞춤 광고를 제공하기 위해 기기 식별자를 사용해요.
        # Compose Multiplatform: 120Hz 화면에서 프레임 제한을 풀어야 한다(없으면 시작 시 검사에서 멈춘다).
        CADisableMinimumFrameDurationOnPhone: true
        # 실행 화면이 없으면 iOS 가 구형 호환(레터박스) 모드로 띄운다 — 전체 화면을 쓰려면 필요.
        # 실행 화면은 Android 시스템 스플래시와 같다(Figma 9 · 공통 상태 · 앱 시작): canvas 바탕 + 말린 꽃 가지.
        # 그다음 셸의 스플래시(꽃신 · 슬로건)가 이어받는다. 색 · 그림은 App/Assets.xcassets(다크 포함).
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchSprig
          UIImageRespectsSafeAreaInsets: true
        # 키는 Config.xcconfig(커밋하지 않음)에서: KAKAO_NATIVE_APP_KEY, GOOGLE_CLIENT_ID, GOOGLE_REVERSED_CLIENT_ID
        KakaoNativeAppKey: $(KAKAO_NATIVE_APP_KEY)
        # 초대 링크 호스트 · 카카오 피드 템플릿 ID(Config.xcconfig 의 INVITE_HOST · KAKAO_INVITE_TEMPLATE_ID)
        KkotsinInviteHost: $(INVITE_HOST)
        KakaoInviteTemplateId: $(KAKAO_INVITE_TEMPLATE_ID)
        GIDClientID: $(GOOGLE_CLIENT_ID)
        LSApplicationQueriesSchemes: [kakaokompassauth, kakaolink]
        CFBundleURLTypes:
          - CFBundleURLSchemes: [kkotsin]
          - CFBundleURLSchemes: ["kakao$(KAKAO_NATIVE_APP_KEY)"]
          - CFBundleURLSchemes: ["$(GOOGLE_REVERSED_CLIENT_ID)"]
        UIBackgroundModes: [remote-notification, fetch]
        # AdMob 앱 ID(꽃신 iOS) + Google 이 권하는 SKAdNetwork 식별자(광고 성과 측정).
        GADApplicationIdentifier: ca-app-pub-9179621242550991~5857677275
        # RevenueCat 공개 SDK 키(Config.xcconfig 의 REVENUECAT_API_KEY, 비면 테스트 스토어 키)
        RevenueCatAPIKey: $(REVENUECAT_API_KEY)
        # 피처 플래그 환경(DEV · QA · PROD, Config.xcconfig 의 APP_ENV). 비어 있으면 PROD.
        KkotsinAppEnv: $(APP_ENV)
        # 업데이트 필요 › 업데이트하기가 여는 App Store ID(Config.xcconfig 의 APP_STORE_ID). 비어 있으면 6827034603.
        KkotsinAppStoreId: $(APP_STORE_ID)
        # GA4 가 광고 개인화 신호를 내지 않는다. AdMob 이 AdSupport 를 링크하므로 Core 변형만으로는 막을 수 없다.
        GOOGLE_ANALYTICS_DEFAULT_ALLOW_AD_PERSONALIZATION_SIGNALS: false
        # 디버그 구성은 NO(위 configs) — 개발 중의 자동 수집 이벤트가 GA4 지표에 섞이지 않게.
        FIREBASE_ANALYTICS_COLLECTION_ENABLED: $(KKOTSIN_ANALYTICS_COLLECTION)
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: cstr6suwn9.skadnetwork
          - SKAdNetworkIdentifier: 4fzdc2evr5.skadnetwork
          - SKAdNetworkIdentifier: 2fnua5tdw4.skadnetwork
          - SKAdNetworkIdentifier: ydx93a7ass.skadnetwork
          - SKAdNetworkIdentifier: p78axxw29g.skadnetwork
          - SKAdNetworkIdentifier: v72qych5uu.skadnetwork
          - SKAdNetworkIdentifier: ludvb6z3bs.skadnetwork
          - SKAdNetworkIdentifier: cp8zw746q7.skadnetwork
          - SKAdNetworkIdentifier: 3sh42y64q3.skadnetwork
          - SKAdNetworkIdentifier: c6k4g5qg8m.skadnetwork
          - SKAdNetworkIdentifier: s39g8k73mm.skadnetwork
          - SKAdNetworkIdentifier: 3qy4746246.skadnetwork
          - SKAdNetworkIdentifier: f38h382jlk.skadnetwork
          - SKAdNetworkIdentifier: hs6bdukanm.skadnetwork
          - SKAdNetworkIdentifier: mlmmfzh3r3.skadnetwork
          - SKAdNetworkIdentifier: v4nxqhlyqp.skadnetwork
          - SKAdNetworkIdentifier: wzmmz9fp6w.skadnetwork
          - SKAdNetworkIdentifier: su67r6k2v3.skadnetwork
          - SKAdNetworkIdentifier: yclnxrl5pm.skadnetwork
          - SKAdNetworkIdentifier: t38b2kh725.skadnetwork
          - SKAdNetworkIdentifier: 7ug5zh24hu.skadnetwork
          - SKAdNetworkIdentifier: gta9lk7p23.skadnetwork
          - SKAdNetworkIdentifier: vutu7akeur.skadnetwork
          - SKAdNetworkIdentifier: y5ghdn5j9k.skadnetwork
          - SKAdNetworkIdentifier: v9wttpbfk9.skadnetwork
          - SKAdNetworkIdentifier: n38lu8286q.skadnetwork
          - SKAdNetworkIdentifier: 47vhws6wlr.skadnetwork
          - SKAdNetworkIdentifier: kbd757ywx3.skadnetwork
          - SKAdNetworkIdentifier: 9t245vhmpl.skadnetwork
          - SKAdNetworkIdentifier: a2p9lx4jpn.skadnetwork
          - SKAdNetworkIdentifier: 22mmun2rn5.skadnetwork
          - SKAdNetworkIdentifier: 44jx6755aq.skadnetwork
          - SKAdNetworkIdentifier: k674qkevps.skadnetwork
          - SKAdNetworkIdentifier: 4468km3ulz.skadnetwork
          - SKAdNetworkIdentifier: 2u9pt9hc89.skadnetwork
          - SKAdNetworkIdentifier: 8s468mfl3y.skadnetwork
          - SKAdNetworkIdentifier: klf5c3l5u5.skadnetwork
          - SKAdNetworkIdentifier: ppxm28t8ap.skadnetwork
          - SKAdNetworkIdentifier: kbmxgpxpgc.skadnetwork
          - SKAdNetworkIdentifier: uw77j35x4d.skadnetwork
          - SKAdNetworkIdentifier: 578prtvx9j.skadnetwork
          - SKAdNetworkIdentifier: 4dzt52r2t5.skadnetwork
          - SKAdNetworkIdentifier: tl55sbb4fm.skadnetwork
          - SKAdNetworkIdentifier: c3frkrj4fj.skadnetwork
          - SKAdNetworkIdentifier: e5fvkxwrpn.skadnetwork
          - SKAdNetworkIdentifier: 8c4e2ghe7u.skadnetwork
          - SKAdNetworkIdentifier: 3rd42ekr43.skadnetwork
          - SKAdNetworkIdentifier: 97r2b46745.skadnetwork
          - SKAdNetworkIdentifier: 3qcr597p9d.skadnetwork
        BGTaskSchedulerPermittedIdentifiers: [com.sadturtleman.kkotsin.refresh]
  KkotsinNotification:
    type: app-extension
    platform: iOS
    sources: [NotificationService, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sadturtleman.kkotsin.notification
    entitlements:
      path: NotificationService/KkotsinNotification.entitlements
      properties:
        com.apple.security.application-groups: [group.com.sadturtleman.kkotsin]
        keychain-access-groups: ["$(AppIdentifierPrefix)com.sadturtleman.kkotsin.shared"]
    dependencies:
      - package: Sodium
    info:
      path: NotificationService/Info.plist
      properties:
        KkotsinKeychainAccessGroup: $(AppIdentifierPrefix)com.sadturtleman.kkotsin.shared
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
  KkotsinWidgets:
    type: app-extension
    platform: iOS
    sources: [Widgets, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sadturtleman.kkotsin.widgets
    entitlements:
      path: Widgets/KkotsinWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.sadturtleman.kkotsin]
        keychain-access-groups: ["$(AppIdentifierPrefix)com.sadturtleman.kkotsin.shared"]
    dependencies:
      - package: Sodium
    info:
      path: Widgets/Info.plist
      properties:
        KkotsinKeychainAccessGroup: $(AppIdentifierPrefix)com.sadturtleman.kkotsin.shared
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  KkotsinTests:
    type: bundle.unit-test
    platform: iOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    sources: [Tests, Shared]
    dependencies:
      - package: Sodium
